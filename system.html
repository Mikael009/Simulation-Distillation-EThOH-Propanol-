<body>
    <div class="header">

        <!-- Controls -->

                <button class="btn btn-trend" onclick="setTrend('levels')" id="btn-level">Levels</button>

<script>
// ======== PHYSICAL PROPERTIES ========
const Antoine = {
    ethanol: {A: 8.20417, B: 1642.89, C: 230.300},
    propanol: {A: 7.99786, B: 1569.70, C: 209.500}
};

function vaporPressure(T, comp) {
    const a = Antoine[comp];
    return Math.pow(10, a.A - a.B / (T + a.C));
}

function relativeVolatility(T) {
    return vaporPressure(T, 'ethanol') / vaporPressure(T, 'propanol');
}

function bubblePoint(x, Ptotal) {
    let T = 85;
    for (let i = 0; i < 20; i++) {
        const P1 = vaporPressure(T, 'ethanol');
        const P2 = vaporPressure(T, 'propanol');
        const Pcalc = x * P1 + (1 - x) * P2;
        if (Math.abs(Pcalc - Ptotal) < 0.1) break;
        T += (Ptotal - Pcalc) * 0.01;
    }
    return T;
}

// ======== PID CONTROLLER ========
class PIDController {
    constructor(Kp, Ki, Kd, sp, outMin, outMax) {
        this.Kp = Kp; this.Ki = Ki; this.Kd = Kd;
        this.setpoint = sp;
        this.outMin = outMin; this.outMax = outMax;
        this.integral = 0;
        this.prevErr = 0;
        this.prevTime = null;
        this.output = 0;
        this.auto = false;
    }

    reset() {
        this.integral = 0;
        this.prevErr = 0;
        this.prevTime = null;
        this.output = 0;
    }

    compute(pv, t) {
        if (!this.auto) return this.output;
        if (this.prevTime === null) this.prevTime = t;
        const dt = Math.max((t - this.prevTime) / 1000, 0.01);
        this.prevTime = t;

        const err = this.setpoint - pv;
        this.integral += err * dt;
        this.integral = Math.max(-100, Math.min(100, this.integral));

        const dErr = (err - this.prevErr) / dt;
        this.prevErr = err;

        let out = this.Kp * err + this.Ki * this.integral + this.Kd * dErr;
        out = Math.max(this.outMin, Math.min(this.outMax, out));
        this.output = out;
        return out;
    }
}

// ======== ALARM SYSTEM ========
class AlarmSystem {
    constructor() {
        this.alarms = [
            {id: 1, name: 'T5 > 38C', check: s => s.T5 > 38, action: 'E2', val: 0, resp: 'Stop reboiler heating'},
            {id: 2, name: 'L1 < 50 mm', check: s => s.L1 < 50, action: 'S1', val: 0, resp: 'Stop Feed Pump'},
            {id: 3, name: 'L4 > 250 mm', check: s => s.L4 > 250, action: 'E2', val: 0, resp: 'Stop reboiler heating'},
            {id: 4, name: 'L4 < 50 mm', check: s => s.L4 < 50, action: 'S2', val: 0, resp: 'Stop Reflux Pump'},
            {id: 5, name: 'L3 > 500 mm', check: s => s.L3 > 500, action: 'S1', val: 0, resp: 'Stop Feed Pump'},
            {id: 6, name: 'L3 < 200 mm', check: s => s.L3 < 200, action: 'E2', val: 0, resp: 'Stop reboiler heating'},
            {id: 7, name: 'F1 approx 0', check: s => s.F1 < 0.1, action: 'E1', val: 0, resp: 'Stop feed heating'},
            {id: 8, name: 'L5 > 150 mm', check: s => s.L5 > 150, action: 'LV1', val: 0, resp: 'Close LV1'},
            {id: 9, name: 'L6 > 150 mm', check: s => s.L6 > 150, action: 'S3', val: 0, resp: 'Stop Bottoms Pump'},
        ];
        this.active = new Set();
        this.interlocks = {};
    }

    check(state) {
        this.active.clear();
        this.interlocks = {};
        for (const a of this.alarms) {
            if (a.check(state)) {
                this.active.add(a.id);
                this.interlocks[a.action] = a.val;
            }
        }
        return this.interlocks;
    }

    reset() {
        this.active.clear();
        this.interlocks = {};
    }
}

// ======== DISTILLATION PLANT ========
class DistillationPlant {
    constructor() {
        this.dt = 0.1;
        this.time = 0;
        this.running = false;
        this.paused = false;

        this.maxE2 = 5000;
        this.maxE1 = 400;
        this.maxF1 = 10;
        this.maxF2 = 16;
        this.maxF3 = 6;
        this.maxF4 = 5;

        this.state = {
            T1: 20, T2: 20, T3: 20, T4: 20, T5: 20,
            T6: 20, T7: 20, T8: 20, T9: 20, T10: 20,
            F1: 0, F2: 0, F3: 0, F4: 0, F5: 0, F6: 0,
            L1: 400, L2: 1, L3: 350, L4: 150, L5: 0, L6: 0,
            P1: 0,
            xD: 0.2, xB: 0.2, xF: 0.2
        };

        this.mv = {
            E1: 0, E2: 0, FV1: 0, FV2: 0, LV1: 0,
            S1: 0, S2: 0, S3: 0, MV1: 50
        };

        this.sv = {
            T8: 25, E2: 0, F1: 0, F2: 0, L4: 150, L3: 350
        };

        this.pids = {
            T8: new PIDController(2, 0.5, 0.1, 25, 0, 100),
            E2: new PIDController(1, 0.2, 0.05, 50, 0, 100),
            F1: new PIDController(5, 1, 0.2, 5, 0, 100),
            F2: new PIDController(5, 1, 0.2, 8, 0, 100),
            L4: new PIDController(2, 0.5, 0.1, 150, 0, 100),
            L3: new PIDController(3, 0.8, 0.15, 350, 0, 50)
        };

        this.alarms = new AlarmSystem();
        this.history = [];
        this.maxHist = 200;
        this.trayX = new Array(11).fill(0.2);
        this.trayT = new Array(11).fill(20);
    }

    start() { this.running = true; this.paused = false; }
    pause() { this.paused = !this.paused; }

    stop() {
        this.running = false;
        this.paused = false;
        this.time = 0;
        this.alarms.reset();
        this.history = [];
        Object.assign(this.state, {
            T1: 20, T2: 20, T3: 20, T4: 20, T5: 20,
            T6: 20, T7: 20, T8: 20, T9: 20, T10: 20,
            F1: 0, F2: 0, F3: 0, F4: 0, F5: 0, F6: 0,
            L1: 400, L2: 1, L3: 350, L4: 150, L5: 0, L6: 0,
            P1: 0, xD: 0.2, xB: 0.2, xF: 0.2
        });
        Object.keys(this.mv).forEach(k => this.mv[k] = k === 'MV1' ? 50 : 0);
        this.trayX.fill(0.2);
        this.trayT.fill(20);
    }

    reset() { this.stop(); }

    setMV(tag, val) {
        const pidMap = {E1: 'T8', E2: 'E2', FV1: 'F1', FV2: 'F2', LV1: 'L4', S3: 'L3'};
        if (pidMap[tag] && this.pids[pidMap[tag]].auto) return false;
        if (tag in this.mv) {
            this.mv[tag] = Math.max(0, Math.min(tag.startsWith('S') ? 50 : 100, val));
            return true;
        }
        return false;
    }

    setSV(tag, val) {
        if (tag in this.sv) {
            this.sv[tag] = val;
            if (this.pids[tag]) this.pids[tag].setpoint = val;
            return true;
        }
        return false;
    }

    setPIDMode(tag, auto) {
        if (this.pids[tag]) {
            this.pids[tag].auto = auto;
            if (auto) this.pids[tag].reset();
            return true;
        }
        return false;
    }

    setPIDTuning(tag, Kp, Ki, Kd) {
        if (this.pids[tag]) {
            this.pids[tag].Kp = Kp;
            this.pids[tag].Ki = Ki;
            this.pids[tag].Kd = Kd;
            return true;
        }
        return false;
    }

    updatePIDs() {
        const t = Date.now();
        if (this.pids.T8.auto) this.mv.E1 = this.pids.T8.compute(this.state.T8, t);
        if (this.pids.E2.auto) this.mv.E2 = this.pids.E2.compute(this.mv.E2, t);
        if (this.pids.F1.auto) this.mv.FV1 = this.pids.F1.compute(this.state.F1, t);
        if (this.pids.F2.auto) this.mv.FV2 = this.pids.F2.compute(this.state.F2, t);
        if (this.pids.L4.auto) this.mv.LV1 = this.pids.L4.compute(this.state.L4, t);
        if (this.pids.L3.auto) this.mv.S3 = this.pids.L3.compute(this.state.L3, t);
    }

    calcFlows() {
        const s = this.state, m = this.mv;
        s.F1 = this.maxF1 * (m.FV1 / 100) * (m.S1 / 50);
        s.F2 = this.maxF2 * (m.FV2 / 100) * (m.S2 / 50);
        s.F3 = this.maxF3 * (m.LV1 / 100);
        s.F4 = this.maxF4 * (m.S3 / 50);
        s.F5 = s.F4;
        s.F6 = 50 * (m.MV1 / 100);
    }

    calcTemps() {
        const s = this.state, m = this.mv;
        const Troom = 20;

        if (s.F1 > 0.1) {
            const power = (m.E1 / 100) * this.maxE1;
            const massFlow = s.F1 * 0.8;
            s.T8 = Troom + (power * 3.6) / (massFlow * 2.5);
        } else {
            s.T8 = Troom;
        }
        s.T8 = Math.min(s.T8, 85);

        if (m.E2 > 0) {
            const powerKW = (m.E2 / 100) * this.maxE2 / 1000;
            const baseT = 78;
            const rise = powerKW * 3;

            s.T4 = Math.min(baseT + rise, 97);
            s.T3 = s.T4 - 2;
            s.T2 = s.T4 - 8;
            s.T1 = s.T4 - 15;
            s.T1 = Math.max(s.T1, 20);

            s.T5 = 25 + powerKW * 2;
            s.T6 = 25;
            s.T7 = s.T6;
            s.T9 = 20 + powerKW * 1.5;
        } else {
            ['T1','T2','T3','T4'].forEach(k => { s[k] += (Troom - s[k]) * 0.01; });
            s.T5 = Math.max(20, s.T5 - 0.05);
            s.T9 = 20;
        }

        for (let i = 0; i < 11; i++) {
            this.trayT[i] = bubblePoint(this.trayX[i]);
        }
        s.T2 = this.trayT[7];
        s.T3 = this.trayT[10];
    }

    calcLevels() {
        const s = this.state, m = this.mv, dt = this.dt;

        const dL1 = -s.F1 * 0.5;
        s.L1 = Math.max(0, Math.min(500, s.L1 + dL1 * dt));

        const liqIn = s.F1 + s.F2 * 0.3;
        const vaporOut = s.F2 + s.F3;
        const dL3 = (liqIn - s.F4 - vaporOut * 0.1) * 0.3;
        s.L3 = Math.max(0, Math.min(650, s.L3 + dL3 * dt));

        const condIn = s.F2 + s.F3;
        const dL4 = (condIn - s.F2 - s.F3 + (m.E2 > 0 ? 1 : -0.5)) * 0.8;
        s.L4 = Math.max(0, Math.min(300, s.L4 + dL4 * dt));

        const dL5 = s.F3 * 0.4;
        s.L5 = Math.max(0, Math.min(200, s.L5 + dL5 * dt));

        const dL6 = s.F4 * 0.4;
        s.L6 = Math.max(0, Math.min(200, s.L6 + dL6 * dt));

        s.L2 = s.F1 > 0.5 ? 1 : 0;
    }

    calcPressure() {
        this.state.P1 = Math.min(10, this.state.L3 * 0.015);
    }

    calcCompositions() {
        const s = this.state, m = this.mv;
        const totalVapor = s.F2 + s.F3;

        if (m.E2 > 5 && totalVapor > 0.5) {
            const RR = s.F2 / Math.max(s.F3, 0.1);
            const sep = Math.min(RR / 5, 0.9);

            s.xD = Math.min(0.2 + sep * 0.75, 0.98);
            s.xB = Math.max(0.2 - sep * 0.18, 0.02);

            for (let i = 0; i < 11; i++) {
                const frac = i / 10;
                this.trayX[i] = s.xB + (s.xD - s.xB) * frac;
            }
        } else {
            s.xD = 0.2;
            s.xB = 0.2;
            this.trayX.fill(0.2);
        }
    }

    step() {
        if (!this.running || this.paused) return;

        this.updatePIDs();
        this.calcFlows();
        this.calcTemps();
        this.calcLevels();
        this.calcPressure();
        this.calcCompositions();

        const locks = this.alarms.check(this.state);
        Object.assign(this.mv, locks);

        this.time += this.dt;

        this.history.push({
            time: this.time,
            ...this.state,
            ...this.mv
        });
        if (this.history.length > this.maxHist) this.history.shift();
    }
}

// ======== CHART ========
let trendChart = null;
let currentTrend = 'temperatures';

const trendConfig = {
    temperatures: {keys: ['T1','T2','T3','T4','T5','T8'], colors: ['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa']},
    flows: {keys: ['F1','F2','F3','F4','F6'], colors: ['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5']},
    levels: {keys: ['L1','L3','L4','L5','L6'], colors: ['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5']},
    compositions: {keys: ['xD','xB','xF'], colors: ['#43a047','#e53935','#1e88e5']},
    pressures: {keys: ['P1'], colors: ['#e53935']}
};

function initChart() {
    const ctx = document.getElementById('trendChart').getContext('2d');
    const cfg = trendConfig[currentTrend];

    trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: cfg.keys.map((k, i) => ({
                label: k,
                data: [],
                borderColor: cfg.colors[i],
                backgroundColor: cfg.colors[i] + '15',
                borderWidth: 2,
                fill: false,
                tension: 0.4,
                pointRadius: 0,
                pointHoverRadius: 4
            }))
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888', font: {size: 11} } },
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888', font: {size: 11} } }
            },
            plugins: {
                legend: { labels: { color: '#ccc', usePointStyle: true, font: {size: 12} } },
                tooltip: {
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    titleColor: '#00d4ff',
                    bodyColor: '#fff',
                    borderColor: 'rgba(0,212,255,0.3)',
                    borderWidth: 1
                }
            }
        }
    });
}

function setTrend(type) {
    currentTrend = type;
    document.querySelectorAll('.btn-trend').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + type.slice(0,4)).classList.add('active');
    if (trendChart) trendChart.destroy();
    initChart();
}

// ======== INTERACTION ========
function simControl(action) {
    if (action === 'start') {
        plant.start();
        if (!simInterval) simInterval = setInterval(simLoop, 100);
    } else if (action === 'pause') {
        plant.pause();
    } else if (action === 'stop') {
        plant.stop();
        if (simInterval) { clearInterval(simInterval); simInterval = null; }
    } else if (action === 'reset') {
        plant.reset();
        if (simInterval) { clearInterval(simInterval); simInterval = null; }
    }
    updateUI();
}

function setMV(tag, val) {
    const v = parseFloat(val);
    if (plant.setMV(tag, v)) {
        const unit = tag.startsWith('S') ? 'Hz' : '%';
        document.getElementById('mv-' + tag).textContent = v.toFixed(1) + unit;
    }
}

function togglePID(tag) {
    const newAuto = !plant.pids[tag].auto;
    plant.setPIDMode(tag, newAuto);

    const toggle = document.getElementById('toggle-' + tag);
    const panel = document.getElementById('pid-panel-' + tag);
    const ctrlTag = tag === 'E2' ? 'E2' : tag === 'F1' ? 'FV1' : tag === 'F2' ? 'FV2' : tag === 'L4' ? 'LV1' : tag === 'L3' ? 'S3' : 'E1';
    const ctrl = document.getElementById('ctrl-' + ctrlTag);

    if (newAuto) {
        toggle.classList.add('on');
        if (panel) panel.style.display = 'grid';
        if (ctrl) ctrl.classList.add('auto-mode');
    } else {
        toggle.classList.remove('on');
        if (panel) panel.style.display = 'none';
        if (ctrl) ctrl.classList.remove('auto-mode');
    }
}

function applyPID(tag) {
    const Kp = parseFloat(document.getElementById('Kp-' + tag).value);
    const Ki = parseFloat(document.getElementById('Ki-' + tag).value);
    const Kd = parseFloat(document.getElementById('Kd-' + tag).value);
    plant.setPIDTuning(tag, Kp, Ki, Kd);
}

// ======== SIMULATION LOOP ========
function simLoop() {
    plant.step();
    updateUI();
}

// ======== UPDATE UI ========
function updateUI() {
    const s = plant.state, m = plant.mv;

    // Status
    document.getElementById('sim-time').textContent = plant.time.toFixed(1);
    document.getElementById('header-xD').textContent = s.xD.toFixed(3);

    const dot = document.getElementById('sim-dot');
    const status = document.getElementById('sim-status');
    if (plant.running && !plant.paused) {
        dot.className = 'status-dot running';
        status.textContent = 'Running';
    } else if (plant.paused) {
        dot.className = 'status-dot paused';
        status.textContent = 'Paused';
    } else {
        dot.className = 'status-dot';
        status.textContent = 'Stopped';
    }

    // Gauges
    gaugeDefs.forEach(g => {
        const el = document.getElementById('val-' + g.key);
        const gauge = document.getElementById('gauge-' + g.key);
        if (el) el.textContent = s[g.key].toFixed(g.key.startsWith('x') ? 3 : 1);
        if (gauge) {
            gauge.classList.remove('alarm');
            if (g.danger && g.danger(s[g.key])) gauge.classList.add('alarm');
        }
    });

    // Alarms
    const alarmCard = document.getElementById('alarm-card');
    alarmCard.classList.toggle('triggered', plant.alarms.active.size > 0);

    plant.alarms.alarms.forEach(a => {
        const row = document.getElementById('alarm-row-' + a.id);
        const st = document.getElementById('alarm-st-' + a.id);
        if (row && st) {
            if (plant.alarms.active.has(a.id)) {
                row.className = 'alarm-row danger';
                st.className = 'alarm-status danger';
                st.textContent = 'TRIGGERED';
            } else {
                row.className = 'alarm-row ok';
                st.className = 'alarm-status ok';
                st.textContent = 'OK';
            }
        }
    });

    // MV displays
    ctrlDefs.forEach(c => {
        const slider = document.getElementById('slider-' + c.tag);
        const display = document.getElementById('mv-' + c.tag);
        if (slider) slider.value = m[c.tag];
        if (display) display.textContent = m[c.tag].toFixed(1) + c.unit;
    });

    // SV displays
    Object.keys(plant.sv).forEach(k => {
        const el = document.getElementById('sv-' + k);
        if (el) el.textContent = plant.sv[k].toFixed(1);
    });

    // PFD
    document.getElementById('pfd-cond-val').textContent = 'T5: ' + s.T5.toFixed(1) + 'C';
    document.getElementById('pfd-col-val').textContent = 'T2: ' + s.T2.toFixed(1) + 'C';
    document.getElementById('pfd-reb-val').textContent = 'E2: ' + m.E2.toFixed(0) + '% | T4: ' + s.T4.toFixed(1) + 'C';
    document.getElementById('pfd-feed-val').textContent = 'L1: ' + s.L1.toFixed(0) + 'mm';
    document.getElementById('pfd-pre-val').textContent = 'T8: ' + s.T8.toFixed(1) + 'C';
    document.getElementById('pfd-condrec-val').textContent = 'L4: ' + s.L4.toFixed(0) + 'mm';
    document.getElementById('pfd-over-val').textContent = 'L5: ' + s.L5.toFixed(0) + 'mm';
    document.getElementById('pfd-botrec-val').textContent = 'L6: ' + s.L6.toFixed(0) + 'mm';

    // PFD alarm colors
    const pfdAlarms = {
        'pfd-reb': s.T5 > 38 || s.L3 < 200 || s.L4 > 250,
        'pfd-cond': s.T5 > 38,
        'pfd-feed': s.L1 < 50,
        'pfd-condrec': s.L4 > 250 || s.L4 < 50,
        'pfd-over': s.L5 > 150,
        'pfd-botrec': s.L6 > 150
    };
    Object.entries(pfdAlarms).forEach(([id, alarm]) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('alarm', alarm);
    });

    // Chart
    updateChart();
}

function updateChart() {
    if (!trendChart || plant.history.length < 2) return;

    const cfg = trendConfig[currentTrend];
    const recent = plant.history.slice(-100);

    trendChart.data.labels = recent.map(h => h.time.toFixed(0));
    cfg.keys.forEach((k, i) => {
        trendChart.data.datasets[i].data = recent.map(h => h[k]);
    });

    trendChart.update('none');
}

// ======== INIT ========
initUI();
initChart();
updateUI();

console.log('PIEAS Distillation Simulator loaded. Click START to begin.');
